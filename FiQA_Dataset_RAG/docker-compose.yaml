services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fiqa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  fastapi:
    build: .
    container_name: fiqa_app
    ports:
      - "8000:8000"
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - qdrant

volumes:
  qdrant_storage: